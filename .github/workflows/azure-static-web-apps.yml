name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - fe-61
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate backend URL
        run: |
          if [ -z "$VITE_GRAPHQL_URL" ]; then
            echo "Set the VITE_GRAPHQL_URL GitHub Actions variable to the deployed backend GraphQL URL."
            exit 1
          fi
        env:
          VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL }}

      - name: Build
        run: npm run build
        env:
          VITE_GRAPHQL_URL: ${{ vars.VITE_GRAPHQL_URL }}

      - name: Validate Azure deployment token
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "Set the AZURE_STATIC_WEB_APPS_API_TOKEN GitHub Actions secret."
            exit 1
          fi
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
